.rv{opacity:0;transform:translateY(16px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*90ms)}
.show .rv{opacity:1;transform:none}
.top{width:100%;display:flex;justify-content:space-between;align-items:center}
.top .hl{width:25.4%}
#share{width:8.9vw;max-width:46px;min-width:38px;aspect-ratio:1;border:0;border-radius:18%;background:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .2s}
#share svg{width:50%;height:50%}
.ph{width:46%;aspect-ratio:1;margin-top:7%;border-radius:50%;padding:2.2%;background:#d4d4d5;border:max(4px,.9vw) solid var(--ink);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.nm{width:52%;margin-top:7.5%}
.sv{width:100%;margin-top:6.5%}
.grid{width:100%;margin-top:5%;display:grid;grid-template-columns:1fr 1fr;gap:1.2% 1.5%}
.btn{display:block;transition:transform .22s cubic-bezier(.3,.8,.3,1),filter .22s;cursor:pointer;border:0;background:none;padding:0;width:100%}
.btn:active,#share:active{transform:scale(.94);filter:brightness(.9)}
@media(hover:hover){.btn:hover{transform:translateY(-2px)}}
.ft{width:52%;margin-top:auto;padding-top:14%;opacity:.9}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);background:var(--ink);color:#eceae6;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
#ss{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center}
#ss.on{display:flex}
#ss .bk{position:absolute;inset:0;background:rgba(10,12,30,.55);backdrop-filter:blur(3px);animation:sf .25s}
#ss .bx{position:relative;width:100%;max-width:520px;background:#e8e7e6;color:var(--ink);border-radius:26px 26px 0 0;padding:12px 20px calc(env(safe-area-inset-bottom,0px) + 22px);animation:su .35s cubic-bezier(.2,.8,.2,1);font-family:system-ui,sans-serif}
@keyframes sf{from{opacity:0}}@keyframes su{from{transform:translateY(60px);opacity:0}}
#ss .gr{display:block;width:40px;height:4px;border-radius:4px;background:#b9b9c2;margin:0 auto 14px}
#ss h3{margin:0 0 14px;font-size:18px;text-align:center}
#ss .url{display:flex;align-items:center;gap:8px;background:#d9d7d7;border-radius:16px;padding:6px 6px 6px 14px}
#ss .url span{flex:1;font-size:13px;color:#445;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ss .url button{border:0;border-radius:12px;background:var(--navy);color:#eceae6;font:600 14px system-ui;padding:10px 16px;cursor:pointer;transition:transform .2s}
#so{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;margin:20px 0 8px}
#so button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;color:var(--ink);font:500 12px system-ui;padding:0;transition:transform .2s}
#so i{width:56px;height:56px;border-radius:18px;background:var(--ink);display:grid;place-items:center;color:#fff;font-style:normal;font:700 21px system-ui;box-shadow:0 4px 12px rgba(17,20,42,.25)}
#so i svg{width:26px;height:26px}
#so button:active,#ss .url button:active,#sn:active{transform:scale(.92)}
#sn{display:block;width:100%;margin-top:10px;border:0;border-radius:16px;background:var(--navy);color:#eceae6;font:600 15px system-ui;padding:14px;cursor:pointer;transition:transform .2s}
.toast{z-index:70}
@media(prefers-reduced-motion:reduce){.rv{transition:opacity .3s;transform:none}}

<script id="main">
/*CFG*/const CFG={"nome":"Hilquias Ribeiro","cargo":"Advogado","telefone":"+5522920188787","email":"hilquias@adv.oabrj.org.br","whatsapp":"https://wa.me/5522920188787","instagram":"https://instagram.com/adv.hilquiasr/","linkedin":"https://www.linkedin.com/in/hilquias-ribeiro/","facebook":"https://www.facebook.com/adv.hilquiasr","telegram":"https://t.me/advogadohilquias","link":""};/*END*/
const KEY={wa:'whatsapp',tel:'telefone',ig:'instagram',li:'linkedin',fb:'facebook',tg:'telegram'};
function applyLinks(){const ed=document.body.classList.contains('editing');document.querySelectorAll('[data-k]').forEach(a=>{const k=a.dataset.k,v=CFG[KEY[k]],h=v?(k==='tel'?'tel:'+v:v):'';if(h)a.setAttribute('href',h);else a.removeAttribute('href');if(k==='tel')a.removeAttribute('target');else a.target='_blank';a.rel='noopener';a.style.display=(h||ed)?'':'none';a.classList.toggle('empty',!h)})}
applyLinks();
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)};
document.getElementById('save').onclick=()=>{if(document.body.classList.contains('editing'))return;
 const v=`BEGIN:VCARD\nVERSION:3.0\nFN:${CFG.nome}\nTITLE:${CFG.cargo}\n${CFG.telefone?'TEL;TYPE=CELL:'+CFG.telefone+'\n':''}${CFG.email?'EMAIL:'+CFG.email+'\n':''}END:VCARD`;
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([v],{type:'text/vcard'}));a.download='Hilquias-Ribeiro.vcf';document.body.appendChild(a);a.click();a.remove();toast('Contato pronto para salvar')}catch(e){toast('Não foi possível salvar')}
};
const ss=document.getElementById('ss'),so=document.getElementById('so');
const shUrl=()=>CFG.link||location.href,shTxt=()=>CFG.nome+' – '+CFG.cargo;
const P=(d,f)=>`<svg viewBox="0 0 24 24" fill="${f?'#fff':'none'}" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const TB=s=>`<b>${s}</b>`;
const OPS=[
 ['WhatsApp',P('M3 21l1.6-4.8A9 9 0 1 1 8 19.6zM9 9c0 3 3 6 6 6l1.3-1.6-2.3-1.2-.9.8c-.9-.4-1.700-1.200-2.100-2.100l.8-.9L10.600 7.700z'),(u,t)=>'https://wa.me/?text='+encodeURIComponent(t+' '+u)],
 ['Telegram',P('M21 4 3 11l6 2 2 6 3-4 5 3z'),(u,t)=>'https://t.me/share/url?url='+encodeURIComponent(u)+'&text='+encodeURIComponent(t)],
 ['Facebook',TB('f'),u=>'https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(u)],
 ['LinkedIn',TB('in'),u=>'https://www.linkedin.com/sharing/share-offsite/?url='+encodeURIComponent(u)],
 ['X',TB('𝕏'),(u,t)=>'https://twitter.com/intent/tweet?text='+encodeURIComponent(t)+'&url='+encodeURIComponent(u)],
 ['E-mail',P('M3 6h18v12H3zM3 7l9 7 9-7'),(u,t)=>'mailto:?subject='+encodeURIComponent(t)+'&body='+encodeURIComponent(t+'\n'+u)],
 ['SMS',P('M4 4h16v12H8l-4 4z'),(u,t)=>'sms:?&body='+encodeURIComponent(t+' '+u)],
 ['Copiar link',P('M9 9h11v11H9zM5 15V5h10'),null]
];
so.innerHTML=OPS.map((o,i)=>`<button data-o="${i}"><i>${o[1]}</i><span>${o[0]}</span></button>`).join('');
const copyUrl=async()=>{const u=shUrl();try{await navigator.clipboard.writeText(u)}catch(e){const a=document.createElement('textarea');a.value=u;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}toast('Link copiado ✓')};
const closeSs=()=>ss.classList.remove('on');
document.getElementById('share').onclick=()=>{document.getElementById('su').textContent=shUrl();document.getElementById('sn').style.display=navigator.share?'':'none';ss.classList.add('on')};
ss.querySelector('.bk').onclick=closeSs;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSs()});
so.onclick=e=>{const b=e.target.closest('[data-o]');if(!b)return;const o=OPS[b.dataset.o];if(!o[2]){copyUrl();return}const h=o[2](shUrl(),shTxt());setTimeout(()=>{if(/^(mailto|sms):/.test(h))location.href=h;else window.open(h,'_blank','noopener')},160)};
document.getElementById('sc').onclick=copyUrl;
document.getElementById('sn').onclick=async()=>{try{await navigator.share({title:CFG.nome,text:shTxt(),url:shUrl()})}catch(e){}};
/* LOADER 0 → 100% */
const ld=document.getElementById('load'),pc=document.getElementById('pct'),T=2600,t0=performance.now();
(function f(n){let r=Math.min((n-t0)/T,1),e=r<.5?2*r*r:1-Math.pow(-2*r+2,2)/2,p=Math.round(e*100);
 ld.style.setProperty('--p',p+'%');pc.textContent=p+'%';
 if(r<1)requestAnimationFrame(f);else setTimeout(()=>{ld.classList.add('done');document.getElementById('page').classList.add('show')},250)})(t0);
</script>
